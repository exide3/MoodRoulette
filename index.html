<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodBoard | Character Generator</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Pinterest скрипт — ОДИН РАЗ на странице -->
    <script async defer src="https://assets.pinterest.com/js/pinit.js"></script>
</head>
<body class="page">
    <div class="page__bg-blob page__bg-blob--purple"></div>
    <div class="page__bg-blob page__bg-blob--blue"></div>

    <main class="main">
        <header class="header">
            <h1 class="header__title">Mood<span class="header__title-accent">Board</span></h1>
            <p class="header__subtitle">Build your unique reference.</p>
        </header>

        <div class="glass-card">
            <!-- Прогресс-бар -->
            <div class="progress-bar">
                <div class="progress-bar__step active">1</div>
                <div class="progress-bar__line"></div>
                <div class="progress-bar__step">2</div>
                <div class="progress-bar__line"></div>
                <div class="progress-bar__step">3</div>
            </div>

            <!-- Контейнер шагов -->
            <div class="step-container" id="step-container">
                <h2 class="step-container__title" id="step-title">General Aesthetic</h2>
                <div class="step-container__result">
                    <span class="step-container__result-text">Ready to spin?</span>
                </div>
                <div class="controls">
                    <button class="btn btn--primary" id="spin-btn">
                        <span class="btn__text">Spin</span>
                    </button>
                    <button class="btn btn--ghost" id="next-btn" style="display:none;">Next →</button>
                </div>
            </div>

            <!-- Итоговая сводка -->
            <div class="summary-container" id="summary-container" style="display:none;">
                <h2 class="summary-container__title">Character Ready!</h2>
                <div class="summary-tags" id="summary-tags"></div>

                <div class="mood-section">
                    <div class="mood-header">
                        <span class="mood-header__title">Pinterest Board</span>
                        <a href="#" class="btn btn--ghost" id="pinterest-link" target="_blank" rel="noopener">Open full board</a>
                    </div>
                    <div class="pinterest-widget-container" id="pinterest-widget"></div>
                </div>

                <button class="btn btn--ghost" id="restart-btn" style="margin-top:24px;">Start Over</button>
            </div>
        </div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
